<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__PAGE_TITLE__</title>
  <style>
    @page {
      size: 13.333in 7.5in;
      margin: 0;
    }

    :root {
      --canvas: #efe9df;
      --paper: #fffdfa;
      --paper-alt: #f8f2ea;
      --text: #251835;
      --muted: #695b78;
      --brand: #6e2b7e;
      --brand-dark: #441750;
      --accent: #eb4a43;
      --line: rgba(68, 23, 80, 0.14);
      --shadow: 0 30px 80px rgba(52, 22, 61, 0.14);
      --stage-width: min(96vw, calc((100vh - 108px) * 16 / 9));
      --stage-height: calc(var(--stage-width) * 9 / 16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(110, 43, 126, 0.08), transparent 28%),
        radial-gradient(circle at bottom right, rgba(235, 74, 67, 0.1), transparent 22%),
        linear-gradient(145deg, #faf7f1 0%, var(--canvas) 55%, #efe5d8 100%);
      color: var(--text);
      font-family: "Segoe UI", "Aptos", sans-serif;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      top: 32px;
      right: 54px;
      width: 164px;
      height: 164px;
      border-radius: 50%;
      border: 16px solid rgba(110, 43, 126, 0.08);
    }

    body::after {
      left: 46px;
      bottom: 40px;
      width: 220px;
      height: 12px;
      background: linear-gradient(90deg, #ed2939 0%, #ed2939 33%, #fff 33%, #fff 66%, #ed2939 66%, #ed2939 100%);
      border-radius: 999px;
      box-shadow: 0 0 0 1px rgba(68, 23, 80, 0.08);
    }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 28px 28px 80px;
    }

    .stage {
      position: relative;
      width: var(--stage-width);
      height: var(--stage-height);
      max-height: calc(100vh - 108px);
      aspect-ratio: 16 / 9;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
    }

    .deck {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.95));
    }

    .slide.is-active {
      display: block;
      animation: slide-enter 280ms ease;
    }

    .slide__frame {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), var(--paper)),
        radial-gradient(circle at top right, rgba(110, 43, 126, 0.05), transparent 28%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .slide__frame::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 18px;
      background: linear-gradient(90deg, var(--brand-dark) 0%, var(--brand) 62%, var(--accent) 100%);
      pointer-events: none;
    }

    .slide__frame::after {
      content: "";
      position: absolute;
      right: 36px;
      bottom: 26px;
      width: 140px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ed2939 0%, #ed2939 33%, #fff 33%, #fff 66%, #ed2939 66%, #ed2939 100%);
      pointer-events: none;
    }

    .slide__brandbar,
    .slide__content,
    .slide__footer {
      position: relative;
      z-index: 1;
    }

    .slide__brandbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 34px 54px 12px;
    }

    .slide__brandtext,
    .slide__eyebrow,
    .slide__kicker,
    .mini-card__label,
    .feature-card__label,
    .stat-card__label,
    .speaker-card__label,
    .link-card__label {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--brand);
    }

    .slide__brandmark {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.35), transparent 36%),
        linear-gradient(145deg, var(--brand) 0%, var(--brand-dark) 100%);
      box-shadow: inset 0 0 0 8px rgba(255, 255, 255, 0.16);
    }

    .slide__content {
      padding: 8px 54px 34px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow: hidden;
    }

    .slide__kicker {
      color: var(--accent);
      margin-top: -8px;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      font-family: Consolas, "Aptos Display", "Segoe UI", sans-serif;
      line-height: 1.04;
      color: var(--brand-dark);
    }

    h1 {
      max-width: 10ch;
      font-size: clamp(3.2rem, 6vw, 5.6rem);
    }

    h2 {
      font-size: clamp(2.1rem, 3.2vw, 3rem);
    }

    h3 {
      font-size: clamp(1.1rem, 1.7vw, 1.5rem);
    }

    p,
    li,
    a {
      margin: 0;
    }

    p,
    li {
      line-height: 1.42;
      font-size: clamp(0.98rem, 1.35vw, 1.2rem);
      color: var(--text);
    }

    .slide__lead {
      max-width: 42rem;
      font-size: clamp(1.05rem, 1.6vw, 1.35rem);
      color: var(--muted);
    }

    .slide__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 54px 24px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .slide__footer-index {
      font-variant-numeric: tabular-nums;
    }

    .hero-layout,
    .two-column-grid {
      display: grid;
      gap: 24px;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.95fr);
      align-items: start;
    }

    .hero-layout {
      flex: 1;
    }

    .hero-layout--talk {
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.8fr);
    }

    .hero-copy {
      display: grid;
      align-content: start;
      gap: 18px;
      padding-top: 12px;
    }

    .slide--hero h1 {
      max-width: 8ch;
      font-size: clamp(3.1rem, 5.2vw, 4.9rem);
    }

    .slide--talk h1 {
      max-width: 10ch;
      font-size: clamp(2.9rem, 4.8vw, 5rem);
    }

    .hero-copy__month {
      font-family: Consolas, "Aptos Display", "Segoe UI", sans-serif;
      font-size: clamp(1.3rem, 2vw, 1.8rem);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .hero-copy__meta {
      max-width: 28rem;
      color: var(--muted);
      font-size: 1.15rem;
    }

    .hero-sidebar,
    .mini-grid,
    .stats-grid,
    .speaker-grid,
    .link-grid,
    .sponsor-grid {
      display: grid;
      gap: 16px;
    }

    .flag-bar {
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ed2939 0%, #ed2939 33%, #fff 33%, #fff 66%, #ed2939 66%, #ed2939 100%);
      box-shadow: 0 0 0 1px rgba(68, 23, 80, 0.1);
      margin-bottom: 4px;
    }

    .stats-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .mini-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
    }

    .mini-grid--events,
    .speaker-grid,
    .link-grid,
    .sponsor-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-content: start;
    }

    .prose {
      display: grid;
      gap: 14px;
      max-width: 56rem;
    }

    .slide--dense .prose p,
    .speaker-card--dense .speaker-card__bio p {
      font-size: 1rem;
      line-height: 1.33;
    }

    .bullet-list {
      margin: 0;
      padding-left: 1.3rem;
      display: grid;
      gap: 10px;
    }

    .mini-card,
    .feature-card,
    .stat-card,
    .speaker-card,
    .link-card,
    .sponsor-card {
      border-radius: 20px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), var(--paper-alt));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .mini-card,
    .feature-card,
    .speaker-card,
    .link-card,
    .sponsor-card {
      padding: 18px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .feature-card--accent,
    .slide--hero .feature-card,
    .slide--talk .feature-card {
      background:
        linear-gradient(180deg, rgba(110, 43, 126, 0.96), rgba(68, 23, 80, 0.96)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0));
      color: #fff;
      border-color: rgba(110, 43, 126, 0.36);
    }

    .feature-card--accent p,
    .feature-card--accent li,
    .slide--hero .feature-card p,
    .slide--talk .feature-card p {
      color: rgba(255, 255, 255, 0.9);
    }

    .feature-card--accent .feature-card__label,
    .slide--hero .feature-card .feature-card__label,
    .slide--talk .feature-card .feature-card__label {
      color: rgba(255, 255, 255, 0.72);
    }

    .stat-card {
      padding: 18px;
      display: grid;
      gap: 4px;
      text-align: left;
      align-content: center;
      min-height: 108px;
    }

    .stat-card__value {
      font-family: Consolas, "Aptos Display", "Segoe UI", sans-serif;
      font-size: 2.4rem;
      line-height: 1;
      color: var(--brand-dark);
    }

    .speaker-card__bio {
      display: grid;
      gap: 10px;
    }

    .link-grid,
    .sponsor-grid,
    .speaker-grid {
      overflow: auto;
      padding-right: 4px;
    }

    .link-card--empty {
      min-height: 280px;
      place-content: center;
      text-align: center;
    }

    .link-card__qr-wrap {
      display: grid;
      place-items: center;
      padding: 12px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(110, 43, 126, 0.05), rgba(255, 255, 255, 0.72));
    }

    .link-card__qr {
      width: min(100%, 168px);
      aspect-ratio: 1;
      object-fit: contain;
    }

    .sponsor-card {
      grid-template-rows: auto 1fr;
    }

    .sponsor-card__media {
      min-height: 88px;
      display: grid;
      place-items: start;
    }

    .sponsor-card__logo {
      max-width: 160px;
      max-height: 52px;
      object-fit: contain;
    }

    .sponsor-card__placeholder {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(110, 43, 126, 0.08);
      color: var(--brand-dark);
      font-weight: 700;
    }

    a {
      color: var(--brand-dark);
      text-decoration-thickness: 0.08em;
      overflow-wrap: anywhere;
    }

    .deck-ui {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(33, 21, 49, 0.74);
      color: #fff;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(33, 21, 49, 0.16);
      z-index: 2;
      opacity: 0.78;
    }

    .deck-ui button {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.12);
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .deck-ui button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .deck-ui__meta {
      min-width: 142px;
      text-align: center;
      font-size: 0.9rem;
      line-height: 1.3;
    }

    .deck-ui__hint {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.72);
    }

    @keyframes slide-enter {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.994);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 900px) {
      :root {
        --stage-width: 100vw;
        --stage-height: 100vh;
      }

      .app {
        padding: 0;
      }

      .stage {
        border-radius: 0;
        max-height: 100vh;
      }

      .slide__brandbar,
      .slide__content,
      .slide__footer {
        padding-left: 22px;
        padding-right: 22px;
      }

      .slide__content {
        padding-bottom: 18px;
      }

      .hero-layout,
      .two-column-grid,
      .mini-grid,
      .mini-grid--events,
      .speaker-grid,
      .link-grid,
      .sponsor-grid,
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .deck-ui {
        left: 12px;
        right: 12px;
        top: auto;
        bottom: 12px;
        justify-content: space-between;
      }
    }

    @media print {
      html,
      body {
        background: #fff;
        overflow: visible;
      }

      body::before,
      body::after,
      .deck-ui {
        display: none;
      }

      .app,
      .stage,
      .deck {
        display: block;
        width: auto;
        height: auto;
        max-height: none;
        padding: 0;
        box-shadow: none;
        background: transparent;
      }

      .slide {
        position: relative;
        display: block !important;
        min-height: 7.5in;
        page-break-after: always;
      }

      .slide__frame {
        min-height: 7.5in;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="stage">
      <div class="deck">
        __SLIDES__
      </div>
    </div>
  </div>

  <div class="deck-ui" aria-label="Slide controls">
    <button type="button" data-action="previous">Previous</button>
    <div class="deck-ui__meta">
      <div id="slide-counter"></div>
      <div class="deck-ui__hint">Arrow keys, space, home, end</div>
    </div>
    <button type="button" data-action="next">Next</button>
  </div>

  <script>
    const slides = Array.from(document.querySelectorAll('.slide'));
    const counter = document.getElementById('slide-counter');
    const buttons = document.querySelectorAll('[data-action]');
    const footerIndices = document.querySelectorAll('.slide__footer-index');
    const baseTitle = document.title;
    let currentIndex = 0;

    footerIndices.forEach((element, index) => {
      element.textContent = `${index + 1} / ${slides.length}`;
    });

    function parseHashIndex() {
      const match = window.location.hash.match(/^#slide-(\d+)$/);
      if (!match) {
        return 0;
      }

      const parsedIndex = Number(match[1]) - 1;
      if (Number.isNaN(parsedIndex)) {
        return 0;
      }

      return Math.min(Math.max(parsedIndex, 0), slides.length - 1);
    }

    function updateUi() {
      slides.forEach((slide, index) => {
        slide.classList.toggle('is-active', index === currentIndex);
      });

      const title = slides[currentIndex]?.dataset.slideTitle || `Slide ${currentIndex + 1}`;
      counter.textContent = `${currentIndex + 1} / ${slides.length} - ${title}`;
      document.title = `${baseTitle} (${currentIndex + 1}/${slides.length})`;
      window.location.hash = `slide-${currentIndex + 1}`;
    }

    function goToSlide(index) {
      currentIndex = Math.min(Math.max(index, 0), slides.length - 1);
      updateUi();
    }

    function moveBy(offset) {
      goToSlide(currentIndex + offset);
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
        event.preventDefault();
        moveBy(1);
      } else if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
        event.preventDefault();
        moveBy(-1);
      } else if (event.key === 'Home') {
        event.preventDefault();
        goToSlide(0);
      } else if (event.key === 'End') {
        event.preventDefault();
        goToSlide(slides.length - 1);
      }
    });

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        if (button.dataset.action === 'previous') {
          moveBy(-1);
        } else {
          moveBy(1);
        }
      });
    });

    window.addEventListener('hashchange', () => {
      const nextIndex = parseHashIndex();
      if (nextIndex !== currentIndex) {
        currentIndex = nextIndex;
        updateUi();
      }
    });

    currentIndex = parseHashIndex();
    updateUi();
  </script>
</body>
</html>
