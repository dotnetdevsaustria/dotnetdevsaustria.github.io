<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__PAGE_TITLE__</title>
<!--
  Generated by scripts/generate_event_slides.js from templates/event_slides.html.
  Layout mirrors the DotNetDevs.at PowerPoint deck (16:9, 12192000 x 6858000 EMU).
  Every slide is 1920 x 1080 px (1 px = 6350 EMU, 1 pt = 2 px) and is scaled to the window.
  Keys: Right / Space / click = next, Left = previous, Home / End,
  F = fullscreen, H = toggle hidden slides.
-->
<style>
  @page { size: 1920px 1080px; margin: 0; }

  :root {
    --purple: #68217A;
    --grey: #898989;
    --accent1: #4472C4;
    --consolas: Consolas, "Cascadia Mono", "Lucida Console", monospace;
    --calibri: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #1e1e1e;
    overflow: hidden;
  }

  #viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #deck {
    position: relative;
    width: 1920px;
    height: 1080px;
    flex: none;
    transform-origin: center center;
  }

  .slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #fff;
    display: none;
    font-family: var(--consolas);
    font-weight: bold;
    color: var(--purple);
    -webkit-font-smoothing: antialiased;
  }
  .slide.active { display: block; }

  /* Backgrounds from slide master / slide */
  .bg-default { background: #fff url("__BG_DEFAULT__") 0 0 / 1920px 1080px no-repeat; }
  .bg-dotnetdevs { background: #fff url("__BG_DOTNETDEVS__") 0 0 / 1920px 1080px no-repeat; }

  /* Text frames: default insets 0.1" / 0.05" */
  .tb {
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 7.2px 14.4px;
    white-space: normal;
    overflow-wrap: break-word;
  }
  .tb.anchor-b { justify-content: flex-end; }
  .tb.anchor-ctr { justify-content: center; }
  .tb p { margin: 0; line-height: 1.08; }
  .tb p + p { margin-top: 20px; }
  /* Baseline correction so browser text matches PowerPoint text layout */
  .tb p { position: relative; top: var(--dy, 0); }
  .tb.big { --dy: -0.045em; }
  .tb.link { --dy: 0.1em; }
  .tb .ctr { text-align: center; }

  /* Placeholders from the slide layouts */
  .title-master   { --dy: -0.05em; left: 132px; top: 57.5px; width: 1656px; height: 208.75px; font-size: 88px; }
  .section-title  { --dy: -0.045em; left: 131px; top: 269.25px; width: 1656px; height: 449.25px; font-size: 120px; }
  .section-body   { --dy: -2px; left: 131px; top: 722.75px; width: 1656px; height: 236.25px; font-size: 48px; color: var(--grey); }
  .img { position: absolute; display: block; }

  .calibri { font-family: var(--calibri); }
  .calibri p { line-height: 1.099; }

  /* Timeline (SmartArt) */
  .tl-text { position: absolute; font-family: var(--calibri); color: #000; display: flex; flex-direction: column; }
  .tl-text p { margin: 0; line-height: 1.099; }
  .tl-text.small { font-size: 30px; }
  .tl-text.small p { margin-bottom: 0.383em; }
  .tl-text.big { font-size: 40px; justify-content: center; padding-right: 20px; }
  .tl-text sup { font-size: 0.66em; vertical-align: 0.6em; line-height: 0; }

  /* Navigation */
  #hud {
    position: fixed;
    right: 12px;
    bottom: 10px;
    font: 13px var(--calibri);
    color: #bbb;
    background: rgba(0, 0, 0, .45);
    padding: 3px 9px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
  }
  body.show-hud #hud { opacity: 1; }
  body.show-hud .slide.is-hidden-slide::after {
    content: "hidden";
    position: absolute;
    left: 12px;
    bottom: 10px;
    font: 20px var(--calibri);
    color: #fff;
    background: rgba(0, 0, 0, .5);
    padding: 2px 10px;
    border-radius: 4px;
  }

  @media print {
    html, body { height: auto; overflow: visible; background: #fff; }
    #viewport { position: static; display: block; }
    #deck { transform: none !important; width: auto; height: auto; }
    .slide { position: relative; display: block; break-after: page; }
    .slide[data-hidden] { display: none; }
    .slide.is-hidden-slide::after, #hud { display: none; }
  }
</style>
</head>
<body>
<div id="viewport">
<div id="deck">
__SLIDES__
</div>
</div>
<div id="hud"></div>

<script>
(() => {
  const deck = document.getElementById('deck');
  const hud = document.getElementById('hud');
  const slides = [...document.querySelectorAll('.slide')];
  const params = new URLSearchParams(location.search);
  const exportMode = params.has('export');
  let showHidden = params.has('hidden');
  let current = 0;
  let hudTimer;

  const visible = () => slides.map((s, i) => i).filter(i => showHidden || !slides[i].hasAttribute('data-hidden'));

  // Like PowerPoint's "shrink text on overflow": reduce font size until the text fits its frame.
  function autofit() {
    slides.forEach(slide => {
      const previous = slide.style.display;
      slide.style.display = 'block';
      slide.querySelectorAll('[data-autofit]').forEach(el => {
        const justify = el.style.justifyContent;
        el.style.justifyContent = 'flex-start';
        // Always start from the original size so a re-run (e.g. after fonts loaded) is stable.
        if (el.dataset.baseFontSize === undefined) el.dataset.baseFontSize = el.style.fontSize;
        el.style.fontSize = el.dataset.baseFontSize;
        let size = parseFloat(getComputedStyle(el).fontSize);
        const overflows = () => {
          const last = el.lastElementChild;
          if (!last) return false;
          const needed = last.offsetTop + last.offsetHeight + parseFloat(getComputedStyle(el).paddingBottom);
          return needed > el.clientHeight + 1;
        };
        while (overflows() && size > 16) {
          size -= 2;
          el.style.fontSize = `${size}px`;
        }
        el.style.justifyContent = justify;
      });
      slide.style.display = previous;
    });
  }

  function fit() {
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    deck.style.transform = `scale(${scale})`;
  }

  function show(index, updateHash = true) {
    const list = visible();
    if (!list.includes(index)) {
      index = list.find(i => i >= index) ?? list[list.length - 1];
    }
    current = index;
    slides.forEach((s, i) => {
      s.classList.toggle('active', i === index);
      s.classList.toggle('is-hidden-slide', showHidden && s.hasAttribute('data-hidden'));
    });
    if (updateHash) history.replaceState(null, '', `#${index + 1}`);
    hud.textContent = `${index + 1} / ${slides.length}${showHidden ? ' · all slides' : ''}`;
    if (exportMode) return;
    document.body.classList.add('show-hud');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => document.body.classList.remove('show-hud'), 1500);
  }

  function step(delta) {
    const list = visible();
    const pos = list.indexOf(current);
    const next = list[Math.min(Math.max(pos + delta, 0), list.length - 1)];
    show(next);
  }

  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ': case 'Enter': case 'n':
        e.preventDefault(); step(1); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace': case 'p':
        e.preventDefault(); step(-1); break;
      case 'Home': show(visible()[0]); break;
      case 'End': { const l = visible(); show(l[l.length - 1]); break; }
      case 'f': case 'F':
        if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
        break;
      case 'h': case 'H':
        showHidden = !showHidden; show(current); break;
    }
  });

  document.addEventListener('click', e => step(e.clientX < window.innerWidth / 4 ? -1 : 1));
  document.addEventListener('contextmenu', e => { e.preventDefault(); step(-1); });

  let touchX = null;
  document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
    touchX = null;
  });

  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => {
    const n = parseInt(location.hash.slice(1), 10);
    if (n >= 1 && n <= slides.length) show(n - 1, false);
  });

  autofit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(autofit);
  window.addEventListener('load', autofit);
  fit();
  const start = parseInt(location.hash.slice(1), 10);
  if (start >= 1 && start <= slides.length && slides[start - 1].hasAttribute('data-hidden')) showHidden = true;
  show(start >= 1 && start <= slides.length ? start - 1 : 0, false);
})();
</script>
</body>
</html>
